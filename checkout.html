<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Ethereal Whispers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
  <header class="checkout-header">
    <div class="checkout-brand">
      <a href="/" class="brand-link">Ethereal Whispers</a>
      <span class="brand-tag">Checkout seguro</span>
    </div>
    <a class="back-link" href="/">← Volver a la tienda</a>
  </header>

  <main class="checkout-main">
    <section class="checkout-card">
      <div class="checkout-stepper">
        <strong>Información del pedido</strong>
        <small>Completa todos los datos para crear tu orden.</small>
      </div>

      <div class="checkout-content">
        <div class="checkout-input-group">
          <label for="fullName">Nombre completo</label>
          <input id="fullName" type="text" autocomplete="name" placeholder="Ej. Andrea Martínez" />
        </div>
        <div class="checkout-input-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" autocomplete="email" placeholder="ejemplo@correo.com" />
        </div>
        <div class="checkout-input-group">
          <label for="phone">Teléfono</label>
          <input id="phone" type="tel" autocomplete="tel" placeholder="+57 300 123 4567" />
        </div>
        <div class="checkout-input-group">
          <label for="delivery">Dirección de entrega</label>
          <textarea id="delivery" rows="4" placeholder="Calle 123 #45-67, Barranquilla"></textarea>
        </div>
        <div class="checkout-error" id="checkoutError" aria-live="polite"></div>
      </div>

      <div class="checkout-actions">
        <button id="payButton" type="button" class="primary">Pagar ahora</button>
      </div>
    </section>

    <aside class="checkout-summary">
      <div class="summary-box">
        <h2>Resumen del pedido</h2>
        <div id="summaryItems" class="summary-items"></div>
        <div class="summary-total">
          <span>Total estimado</span>
          <strong id="summaryTotal">$0</strong>
        </div>
      </div>
    </aside>
  </main>

  <div id="checkoutStatus" class="checkout-status" hidden>
    <p id="checkoutStatusMessage">Redireccionando al pago...</p>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
